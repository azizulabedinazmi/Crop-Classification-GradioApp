<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fef9c3"/><stop offset="1" stop-color="#bbf7d0"/></linearGradient>
    <pattern id="patch" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-opacity=".55"/></pattern>
    <style>.scan{animation:s 3.5s ease-in-out infinite alternate}@keyframes s{from{transform:translateX(0)}to{transform:translateX(336px)}}</style>
  </defs>
  <rect width="1200" height="320" fill="url(#sky)"/>
  <circle cx="1110" cy="60" r="34" fill="#fde047"/>
  <!-- rolling field rows -->
  <path d="M0 210C200 170 400 190 600 175s420-40 600-20V320H0z" fill="#84cc16"/>
  <path d="M0 240c220-30 420-10 640-25s380-20 560 0V320H0z" fill="#65a30d"/>
  <path d="M0 275c260-20 520-5 760-15s300-5 440 5V320H0z" fill="#3f6212"/>
  <g stroke="#365314" stroke-width="2" opacity=".5" fill="none"><path d="M120 320 520 190"/><path d="M300 320 600 186"/><path d="M500 320 690 180"/><path d="M720 320 780 172"/><path d="M940 320 870 165"/><path d="M1140 320 960 160"/></g>
  <!-- ViT patch grid over a crop -->
  <g transform="translate(720 26)">
    <rect width="384" height="192" rx="6" fill="#ecfccb" fill-opacity=".55"/>
    <g fill="#15803d">
      <path d="M96 180V60" stroke="#15803d" stroke-width="5"/><ellipse cx="76" cy="90" rx="22" ry="9" transform="rotate(-30 76 90)"/><ellipse cx="116" cy="110" rx="22" ry="9" transform="rotate(30 116 110)"/><ellipse cx="96" cy="50" rx="9" ry="20" fill="#ca8a04"/>
      <path d="M220 180V40" stroke="#15803d" stroke-width="5"/><ellipse cx="198" cy="80" rx="24" ry="9" transform="rotate(-30 198 80)"/><ellipse cx="242" cy="120" rx="24" ry="9" transform="rotate(30 242 120)"/><ellipse cx="220" cy="32" rx="10" ry="22" fill="#ca8a04"/>
      <path d="M320 180V70" stroke="#15803d" stroke-width="5"/><ellipse cx="300" cy="104" rx="20" ry="8" transform="rotate(-30 300 104)"/><ellipse cx="320" cy="60" rx="8" ry="18" fill="#ca8a04"/>
    </g>
    <rect width="384" height="192" fill="url(#patch)"/>
    <rect class="scan" x="0" y="0" width="48" height="192" fill="#14b8a6" fill-opacity=".25" stroke="#0f766e" stroke-width="2"/>
    <rect x="0" y="198" width="384" height="34" rx="6" fill="#134e4a"/>
    <text x="14" y="221" font-family="Consolas, Menlo, monospace" font-size="15" fill="#99f6e4">pred: <tspan fill="#fde047" font-weight="700">Maize</tspan>  conf 0.97  · 30 classes</text>
  </g>
  <text x="66" y="76" font-family="Consolas, Menlo, monospace" font-size="17" fill="#15803d" letter-spacing="2">SimCLR · NNCLR · Barlow Twins · ViT</text>
  <text x="62" y="140" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" fill="#14532d">Crop Classification</text>
  <text x="64" y="176" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#166534">self-supervised learning for 30 agricultural crops 🌾</text>
</svg>
